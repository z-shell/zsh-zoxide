---
name: Zsh CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

# The reusable workflow owns its distinct native-Zsh concurrency group.
jobs:
  native:
    name: Native Zsh
    uses: z-shell/.github/.github/workflows/zsh-ci.yml@f7ec572de9874ebd815fc4e49ce1419084348728 # main
    with:
      require-sources: true
      run-zcompile: true
      # The upstream _zoxide completion is a submodule symlink, not a local source.
      extra-files: |
        functions/.zi-prepare-zoxide
        functions/.zsh-prepare-zoxide
        functions/@zsh-eval-cache
